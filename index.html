<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DonationAlerts — Донаты</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/centrifuge/2.8.5/centrifuge.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f23;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    h1 { color: #f95a2c; margin-bottom: 8px; font-size: 28px; }
    .subtitle { color: #888; margin-bottom: 30px; font-size: 14px; }
    .status-card {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      padding: 24px 32px;
      text-align: center;
      margin-bottom: 30px;
      min-width: 360px;
    }
    .status-card .label { color: #888; font-size: 13px; margin-bottom: 6px; }
    .status-card .value { font-size: 18px; font-weight: 600; }
    .online { color: #4caf50; }
    .offline { color: #f44336; }
    .connecting { color: #ff9800; }
    .stats {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      max-width: 600px;
      width: 100%;
    }
    .stat-box {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 10px;
      padding: 16px 24px;
      text-align: center;
      flex: 1;
    }
    .stat-box .stat-value { font-size: 24px; font-weight: 700; color: #4caf50; }
    .stat-box .stat-label { font-size: 12px; color: #888; margin-top: 4px; }
    .donations {
      width: 100%;
      max-width: 600px;
    }
    .donations h2 {
      color: #ccc;
      font-size: 18px;
      margin-bottom: 14px;
      border-bottom: 1px solid #2a2a4a;
      padding-bottom: 8px;
    }
    .donation-item {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 10px;
      animation: slideIn 0.3s ease;
    }
    .donation-item .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .donation-item .username { font-weight: 600; color: #f95a2c; }
    .donation-item .amount { font-weight: 700; color: #4caf50; font-size: 18px; }
    .donation-item .message { color: #aaa; font-size: 14px; }
    .empty { color: #555; text-align: center; padding: 40px 0; }
    .log { color: #555; font-size: 12px; margin-top: 30px; max-width: 600px; word-break: break-all; }
    .log div { margin-bottom: 4px; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <h1>DonationAlerts</h1>
  <p class="subtitle">oplataSocks — приём донатов в реальном времени</p>

  <div class="status-card">
    <div class="label">Статус</div>
    <div class="value connecting" id="status">Подключение...</div>
    <div class="label" style="margin-top:10px" id="user-info">oplataSocks</div>
  </div>

  <div class="stats">
    <div class="stat-box">
      <div class="stat-value" id="total-count">0</div>
      <div class="stat-label">Донатов</div>
    </div>
    <div class="stat-box">
      <div class="stat-value" id="total-sum">0</div>
      <div class="stat-label">Сумма (RUB)</div>
    </div>
  </div>

  <div class="donations">
    <h2>Донаты в реальном времени</h2>
    <div id="donation-list">
      <div class="empty">Ожидание донатов...</div>
    </div>
  </div>

  <div class="log" id="log"></div>

  <script>
    // Данные пользователя (получены через API)
    const USER_ID = 15397062;
    const USER_NAME = 'oplataSocks';
    const SOCKET_TOKEN = 'eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJDbGllbnQ6MTg1MzQifQ.-5T1TKR2g0r_SSMf7aIcMmZjmmsgb2tJ1rzZnubn5hs';

    const statusEl     = document.getElementById('status');
    const donationList = document.getElementById('donation-list');
    const logEl        = document.getElementById('log');
    let hasDonations   = false;
    let totalCount     = 0;
    let totalSum       = 0;

    function log(msg) {
      console.log(msg);
      const d = document.createElement('div');
      d.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logEl.prepend(d);
    }

    function addDonation(d) {
      if (!hasDonations) {
        donationList.innerHTML = '';
        hasDonations = true;
      }

      totalCount++;
      const amount = parseFloat(d.amount) || 0;
      const currency = d.currency || 'RUB';
      if (currency === 'RUB') totalSum += amount;

      document.getElementById('total-count').textContent = totalCount;
      document.getElementById('total-sum').textContent = totalSum.toLocaleString('ru-RU');

      const div = document.createElement('div');
      div.className = 'donation-item';
      div.innerHTML = `
        <div class="top">
          <span class="username">${escapeHtml(d.username || 'Аноним')}</span>
          <span class="amount">${d.amount} ${d.currency}</span>
        </div>
        <div class="message">${escapeHtml(d.message || '—')}</div>
      `;
      donationList.prepend(div);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Подключение к Centrifugo WebSocket (v2 API)
    function connect() {
      log('Подключение к WebSocket...');

      const centrifuge = new Centrifuge('wss://centrifugo.donationalerts.com/connection/websocket');
      centrifuge.setToken(SOCKET_TOKEN);

      centrifuge.on('connect', function(ctx) {
        log('WebSocket подключён!');
        statusEl.textContent = 'Подключено ✓';
        statusEl.className = 'value online';
      });

      centrifuge.on('disconnect', function(ctx) {
        log('WebSocket отключён: ' + ctx.reason);
        statusEl.textContent = 'Отключено — переподключение...';
        statusEl.className = 'value offline';
      });

      centrifuge.on('error', function(ctx) {
        log('Ошибка: ' + JSON.stringify(ctx));
      });

      const channel = '$alerts:donation_' + USER_ID;
      centrifuge.subscribe(channel, function(msg) {
        const d = msg.data;
        log('Донат: ' + (d.username || 'Аноним') + ' — ' + d.amount + ' ' + d.currency);
        addDonation(d);
      });

      centrifuge.connect();
    }

    connect();
  </script>
</body>
</html>
