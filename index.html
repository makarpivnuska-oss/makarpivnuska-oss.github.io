<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DonationAlerts — Донаты</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/centrifuge/2.8.5/centrifuge.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f23;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    h1 { color: #f95a2c; margin-bottom: 8px; font-size: 28px; }
    .subtitle { color: #888; margin-bottom: 30px; font-size: 14px; }
    .status-card {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      padding: 24px 32px;
      text-align: center;
      margin-bottom: 30px;
      min-width: 360px;
    }
    .status-card .label { color: #888; font-size: 13px; margin-bottom: 6px; }
    .status-card .value { font-size: 18px; font-weight: 600; }
    .online { color: #4caf50; }
    .offline { color: #f44336; }
    .connecting { color: #ff9800; }
    .btn {
      display: inline-block;
      background: #f95a2c;
      color: #fff;
      padding: 12px 32px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      border: none;
      transition: background .2s;
      margin-bottom: 30px;
    }
    .btn:hover { background: #e04a1c; }
    .stats {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      max-width: 600px;
      width: 100%;
    }
    .stat-box {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 10px;
      padding: 16px 24px;
      text-align: center;
      flex: 1;
    }
    .stat-box .stat-value { font-size: 24px; font-weight: 700; color: #4caf50; }
    .stat-box .stat-label { font-size: 12px; color: #888; margin-top: 4px; }
    .donations {
      width: 100%;
      max-width: 600px;
    }
    .donations h2 {
      color: #ccc;
      font-size: 18px;
      margin-bottom: 14px;
      border-bottom: 1px solid #2a2a4a;
      padding-bottom: 8px;
    }
    .donation-item {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 10px;
      animation: slideIn 0.3s ease;
    }
    .donation-item .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .donation-item .username { font-weight: 600; color: #f95a2c; }
    .donation-item .amount { font-weight: 700; color: #4caf50; font-size: 18px; }
    .donation-item .message { color: #aaa; font-size: 14px; }
    .empty { color: #555; text-align: center; padding: 40px 0; }
    .log { color: #555; font-size: 12px; margin-top: 30px; max-width: 600px; word-break: break-all; }
    .log div { margin-bottom: 4px; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <h1>DonationAlerts</h1>
  <p class="subtitle">Приём донатов в реальном времени</p>

  <div class="status-card">
    <div class="label">Статус</div>
    <div class="value" id="status">Не подключено</div>
    <div class="label" style="margin-top:10px" id="user-info"></div>
  </div>

  <button class="btn" id="connect-btn" onclick="startAuth()">Подключить DonationAlerts</button>

  <div class="stats" id="stats" style="display:none;">
    <div class="stat-box">
      <div class="stat-value" id="total-count">0</div>
      <div class="stat-label">Донатов</div>
    </div>
    <div class="stat-box">
      <div class="stat-value" id="total-sum">0</div>
      <div class="stat-label">Сумма (RUB)</div>
    </div>
  </div>

  <div class="donations">
    <h2>Донаты в реальном времени</h2>
    <div id="donation-list">
      <div class="empty">Подключитесь и ждите донатов...</div>
    </div>
  </div>

  <div class="log" id="log"></div>

  <script>
    const CONFIG = {
      CLIENT_ID: '18535',
      REDIRECT_URI: 'https://makarpivnuska-oss.github.io/callback',
      SCOPES: 'oauth-user-show oauth-donation-index oauth-donation-subscribe',
    };

    const statusEl     = document.getElementById('status');
    const userInfoEl   = document.getElementById('user-info');
    const connectBtn   = document.getElementById('connect-btn');
    const donationList = document.getElementById('donation-list');
    const statsEl      = document.getElementById('stats');
    const logEl        = document.getElementById('log');
    let hasDonations   = false;
    let totalCount     = 0;
    let totalSum       = 0;
    let accessToken    = null;

    function log(msg) {
      console.log(msg);
      const d = document.createElement('div');
      d.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
      logEl.prepend(d);
    }

    // ── OAuth ────────────────────────────────────────────────────
    function startAuth() {
      var url = 'https://www.donationalerts.com/oauth/authorize' +
        '?client_id=' + CONFIG.CLIENT_ID +
        '&redirect_uri=' + encodeURIComponent(CONFIG.REDIRECT_URI) +
        '&response_type=token' +
        '&scope=' + encodeURIComponent(CONFIG.SCOPES);
      window.location.href = url;
    }

    function getTokenFromHash() {
      var hash = window.location.hash.substring(1);
      if (!hash) return null;
      var params = new URLSearchParams(hash);
      return params.get('access_token');
    }

    // ── Centrifugo v2 с subscribeEndpoint ────────────────────────
    function connectWebSocket(socketToken, userId, userName) {
      log('Подключение к WebSocket...');

      var centrifuge = new Centrifuge('wss://centrifugo.donationalerts.com/connection/websocket', {
        subscribeEndpoint: 'https://www.donationalerts.com/api/v1/centrifuge/subscribe',
        subscribeHeaders: {
          'Authorization': 'Bearer ' + accessToken
        }
      });

      centrifuge.setToken(socketToken);

      centrifuge.on('connect', function() {
        log('WebSocket подключён!');
        statusEl.textContent = 'Подключено ✓';
        statusEl.className = 'value online';
        userInfoEl.textContent = 'Пользователь: ' + userName;
        connectBtn.textContent = 'Отключить';
        connectBtn.onclick = logout;
        connectBtn.style.display = 'inline-block';
        statsEl.style.display = 'flex';
      });

      centrifuge.on('disconnect', function(ctx) {
        log('WebSocket отключён: ' + ctx.reason);
        statusEl.textContent = 'Отключено — переподключение...';
        statusEl.className = 'value offline';
      });

      centrifuge.on('error', function(ctx) {
        log('Ошибка WS: ' + JSON.stringify(ctx));
      });

      var channel = '$alerts:donation_' + userId;
      centrifuge.subscribe(channel, function(msg) {
        var d = msg.data;
        log('Донат: ' + (d.username || 'Аноним') + ' — ' + d.amount + ' ' + d.currency);
        addDonation(d);
      });

      centrifuge.connect();
    }

    // ── UI ────────────────────────────────────────────────────────
    function addDonation(d) {
      if (!hasDonations) {
        donationList.innerHTML = '';
        hasDonations = true;
      }

      totalCount++;
      var amount = parseFloat(d.amount) || 0;
      var currency = d.currency || 'RUB';
      if (currency === 'RUB') totalSum += amount;

      document.getElementById('total-count').textContent = totalCount;
      document.getElementById('total-sum').textContent = totalSum.toLocaleString('ru-RU');

      var div = document.createElement('div');
      div.className = 'donation-item';
      div.innerHTML =
        '<div class="top">' +
          '<span class="username">' + escapeHtml(d.username || 'Аноним') + '</span>' +
          '<span class="amount">' + d.amount + ' ' + d.currency + '</span>' +
        '</div>' +
        '<div class="message">' + escapeHtml(d.message || '—') + '</div>';
      donationList.prepend(div);
    }

    function escapeHtml(text) {
      var div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ── Init ─────────────────────────────────────────────────────
    // Подключение по токену
    async function connectWithToken(token) {
      accessToken = token;

      statusEl.textContent = 'Подключение...';
      statusEl.className = 'value connecting';
      connectBtn.style.display = 'none';
      log('Подключение к DonationAlerts...');

      try {
        var profileRes = await fetch('https://www.donationalerts.com/api/v1/user/oauth', {
          headers: { 'Authorization': 'Bearer ' + token }
        });

        if (!profileRes.ok) {
          // Токен протух — удаляем и просим заново
          localStorage.removeItem('da_token');
          throw new Error('Токен истёк, авторизуйтесь заново');
        }

        var profileData = await profileRes.json();
        var profile = profileData.data;

        // Сохраняем токен и данные
        localStorage.setItem('da_token', token);
        localStorage.setItem('da_user_name', profile.name);
        localStorage.setItem('da_user_id', profile.id);

        log('Пользователь: ' + profile.name + ' (id: ' + profile.id + ')');

        connectWebSocket(profile.socket_connection_token, profile.id, profile.name);

      } catch (e) {
        log('Ошибка: ' + e.message);
        statusEl.textContent = 'Ошибка подключения';
        statusEl.className = 'value offline';
        connectBtn.style.display = 'inline-block';
        connectBtn.textContent = 'Подключить заново';
      }
    }

    // Выход
    function logout() {
      localStorage.removeItem('da_token');
      localStorage.removeItem('da_user_name');
      localStorage.removeItem('da_user_id');
      window.location.reload();
    }

    async function init() {
      // 1. Проверяем hash (после OAuth редиректа)
      var token = getTokenFromHash();
      if (token) {
        history.replaceState(null, '', window.location.pathname);
        log('Новый токен получен через OAuth');
        return connectWithToken(token);
      }

      // 2. Проверяем сохранённый токен
      var savedToken = localStorage.getItem('da_token');
      if (savedToken) {
        log('Восстановление сессии...');
        return connectWithToken(savedToken);
      }

      // 3. Нет токена — показываем кнопку
      log('Нажмите "Подключить" для авторизации');
    }

    init();
  </script>
</body>
</html>
